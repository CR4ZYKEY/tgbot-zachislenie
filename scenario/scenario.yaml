    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-remind-me-later.jpg"
    text: |-
      Хорошо, не буду торопить.

      <b>Когда вам напомнить?</b>
    buttons:
      - { label: "Напомнить завтра", data: e2_4_wait.tomorrow, next: e2_4 }
      - { label: "Через 3 дня", data: e2_4_wait.in3days, next: e2_4 }

