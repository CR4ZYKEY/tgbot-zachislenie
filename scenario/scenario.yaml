    buttons:
      - { label: "Понятно, начинаем", data: g3_0.ok, next: g3_1 }
    menu: true

  - id: g3_1
    stage: graduate_attach
    stepLabel: "<b>Шаг 3 из 8 · Прикрепление к школе</b>"
    image: "shots/g3-exam-school-gate.jpg"
    text: >-
      Сначала выберите школу, где ваш герой будет сдавать
      {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}}, и прикрепитесь к ней. Аттестат потом
      выдаст именно она. Уже прикрепились?
    buttons:
      - { label: "Да", data: g3_1.yes, next: g4_1 }
      - { label: "Ещё нет", data: g3_1.no, next: g3_later }
      - { label: "Как это сделать?", data: g3_1.how, next: g3_how }
    menu: true

  - id: g3_how
    stage: graduate_attach
    stepLabel: "<b>Шаг 3 из 8 · Прикрепление к школе</b>"
    image: "shots/g3-attach-how.jpg"
    text: |-
      Порядок такой:
      1) Открепитесь от школы, где проходили промежуточную аттестацию.
      2) Узнайте условия и сроки прикрепления в выбранной школе — у каждой они свои.
      3) Прикрепитесь, приложив справку с оценками за промежуточную аттестацию.
    buttons:
      - { label: "Понятно", data: g3_how.ok, next: g3_1 }
      - { label: "Нужна помощь", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: g3_later
    stage: graduate_attach
    stepLabel: "<b>Шаг 3 из 8 · Прикрепление к школе</b>"
    image: "shots/g3-later-bench.jpg"
    text: >-
      Хорошо. Прикрепиться нужно до подачи заявлений на экзамен — загляну
      через несколько дней.
    reminders:
      waitingScreens: [g3_later]
      schedule:
        - { afterHours: 72, screen: g3_1 }
    buttons:
      - { label: "Уже прикрепились", data: g3_later.done, next: g4_1 }
    menu: true

  # ─────────── Путь выпускника · Шаг 4. Заявления на экзамен и допуск ───────────

  - id: g4_1
    stage: graduate_applications
    stepLabel: "<b>Шаг 4 из 8 · Заявления</b>"
    image: "shots/g4-two-letters.jpg"
    text: >-
      Теперь заявления. Их два: на {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}} и на
      {{#if grade11}}итоговое сочинение{{else}}итоговое собеседование{{/if}} —
      без зачёта по нему к экзаменам не допускают. Уже подали?
    buttons:
      - { label: "Да, оба", data: g4_1.yes, next: g5_1 }
      - { label: "Ещё нет", data: g4_1.no, next: g4_later }
      - { label: "Как подать?", data: g4_1.how, next: g4_how }
    menu: true

  - id: g4_how
    stage: graduate_applications
    stepLabel: "<b>Шаг 4 из 8 · Заявления</b>"
    image: "shots/g4-how-two-routes.jpg"
    text: |-
      В Москве заявления подают через <b>mos.ru</b>, в других регионах — через школу прикрепления.

      В заявлении на экзамен укажите предметы: обязательные и два по выбору.{{#if grade11}} Предметы ЕГЭ сверьте со списком специальностей вуза.{{/if}}
    buttons:
      - { label: "Понятно", data: g4_how.ok, next: g4_1 }
      - { label: "Нужна помощь", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  # Напоминания о сроках заявлений — в календаре на g_map.
  - id: g4_later
    stage: graduate_applications
    stepLabel: "<b>Шаг 4 из 8 · Заявления</b>"
    image: "shots/g4-calendar-board.jpg"
    text: >-
      Хорошо. Заявление на {{#if grade11}}сочинение принимают до 18 ноября{{else}}собеседование
      принимают до 27 января{{/if}} — я напомню заранее, чтобы вы успели спокойно.
    buttons:
      - { label: "Уже подали", data: g4_later.done, next: g5_1 }
    menu: true

  # ─────────── Путь выпускника · Шаг 5. Подготовка и пробники ───────────

  - id: g5_1
    stage: graduate_prep
    stepLabel: "<b>Шаг 5 из 8 · Подготовка</b>"
    image: "shots/g5-practice-hall.jpg"
    text: >-
      Даты {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}} публикуют в декабре — напомню, когда
      появятся. А пока можно пройти пробный экзамен: это не обязательно, но так
      ваш герой заранее увидит бланки и тайминг.
    buttons:
      - { label: "Как записаться", data: g5_1.mcko, next: g5_mcko }
      - { label: "Где готовиться", data: g5_1.res, next: g5_res }
      - { label: "Пока не нужно", data: g5_1.skip, next: g5_wait }
    menu: true

  # «Получить инструкцию» присылает памятку PDF (assets/docs) и оставляет
  # на экране. Обновить памятку — заменить файл под тем же именем, бот сам
  # перезальёт его в Telegram. ✎ В памятке пока «данные ученика» — ждём правку.
  - id: g5_mcko
    stage: graduate_prep
    stepLabel: "<b>Шаг 5 из 8 · Подготовка</b>"
    image: "shots/g5-practice-hall.jpg"
    text: >-
      Запись — на сайте <b>cnd.mcko.ru</b>, раздел «Индивидуальная диагностика».
      Диагностика платная, оплатить заявку нужно за 72 часа. Пошаговая
      инструкция — по кнопке ниже.
    buttons:
      - { label: "Получить инструкцию", data: g5_mcko.memo, document: "docs/Запись на пробный экзамен МЦКО.pdf" }
      - { label: "Понятно", data: g5_mcko.ok, next: g5_1 }
      - { label: "Нужна помощь", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
    menu: true

  # ✎ Ссылки — из памяток «Путь выпускника» (раздел «Полезные ресурсы»).
  - id: g5_res
    stage: graduate_prep
    stepLabel: "<b>Шаг 5 из 8 · Подготовка</b>"
    image: "shots/g5-rooftop-library.jpg"
    text: "Проверенные ресурсы для подготовки — выбирайте нужный."
    buttons:
      - { label: "Рособрнадзор", url: "https://obrnadzor.gov.ru/gia/" }
      - { label: "Банк заданий ФИПИ", url: "{{#if grade11}}https://fipi.ru/ege/otkrytyy-bank-zadaniy-ege{{else}}https://fipi.ru/oge/otkrytyy-bank-zadaniy-oge{{/if}}" }
      - { label: "{{#if grade11}}Решу ЕГЭ{{else}}Решу ОГЭ{{/if}}", url: "{{#if grade11}}https://ege.sdamgia.ru{{else}}https://oge.sdamgia.ru{{/if}}" }
      - { label: "Понятно", data: g5_res.ok, next: g5_1 }
    menu: true

  # Экран ожидания: дальше бот пишет сам по календарю на g_map.
  - id: g5_wait
    stage: graduate_prep
    stepLabel: "<b>Шаг 5 из 8 · Подготовка</b>"
    image: "shots/g4-calendar-board.jpg"
    text: >-
      Договорились. Следующая важная дата — {{#if grade11}}итоговое сочинение
      2 декабря{{else}}итоговое собеседование 10 февраля{{/if}}. Напишу ближе к ней.
    menu: true

  # ✎ Дата примерная (≈ 15.12) — в памятках указан только месяц.
  # «Готово» оставляет на месте (wait), а не ведёт на g5_wait: к середине
  # декабря у 11 класса сочинение уже позади, и текст g5_wait про него
  # был бы неверен.
  - id: g5_dates
    stage: graduate_prep
    stepLabel: "<b>Шаг 5 из 8 · Подготовка</b>"
    image: "shots/g5-timetable-board.jpg"
    text: >-
      Рособрнадзор опубликовал расписание {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}} на этот
      год. Посмотрите даты по своим предметам и внесите их в семейный календарь.
    buttons:
      - { label: "Открыть расписание", url: "https://obrnadzor.gov.ru/gia/" }
      - { label: "Готово", data: g5_dates.ok, next: wait }
    menu: true

  # ─────────── Путь выпускника · Шаг 6. Собеседование (9) / сочинение (11) ───────────

  - id: g6_1
    stage: graduate_admission
    stepLabel: "<b>Шаг 6 из 8 · {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b>"
    image: "shots/g6-admission-trial.jpg"
    text: >-
      Скоро {{#if grade11}}итоговое сочинение — 2 декабря{{else}}итоговое
      собеседование — 10 февраля{{/if}}, очно в школе прикрепления.
      Заявление на него подано?
    buttons:
      - { label: "Да", data: g6_1.yes, next: g6_ready }
      - { label: "Нет", data: g6_1.no, next: g6_late }
    menu: true

  - id: g6_ready
    stage: graduate_admission
    stepLabel: "<b>Шаг 6 из 8 · {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b>"
    image: "shots/g6-admission-trial.jpg"
    text: >-
      Отлично. В этот день возьмите документ, удостоверяющий личность. После
      узнайте в школе результат — «зачёт» или «незачёт». Я спрошу, как прошло.
    buttons:
      - { label: "Понятно", data: g6_ready.ok, next: wait }
    menu: true

  - id: g6_late
    stage: graduate_admission
    stepLabel: "<b>Шаг 6 из 8 · {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b>"
    image: "shots/g6-reserve-bridge.jpg"
    text: >-
      На основную дату заявление уже не примут, но есть резервные. Уточните их
      в школе прикрепления — лучше не откладывая.
    buttons:
      - { label: "Понятно", data: g6_late.ok, next: wait }
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
    menu: true

  # Спрашивает календарь на g_map (≈ 2 недели после даты) и сам себя
  # каждые 3 дня, пока ответа нет (rearm) — до паузы после трёх молчаний.
  - id: g6_result
    stage: graduate_admission
    stepLabel: "<b>Шаг 6 из 8 · {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b>"
    image: "shots/g6-sealed-envelope.jpg"
    text: >-
      Как прошло {{#if grade11}}сочинение{{else}}собеседование{{/if}}? Результат
      сообщает школа прикрепления.
    reminders:
      waitingScreens: [g6_result]
      schedule:
        - { afterHours: 72, screen: g6_result, rearm: true }
    buttons:
      - { label: "Зачёт", data: g6_result.pass, next: g7_1 }
      - { label: "Незачёт", data: g6_result.fail, next: g6_retry }
      - { label: "Ещё не знаем", data: g6_result.unknown, next: wait }
    menu: true

  # ✎ Через 2 недели снова спросим результат: резервные даты у каждой школы
  # свои, в памятках их нет — точнее не привязать.
  - id: g6_retry
    stage: graduate_admission
    stepLabel: "<b>Шаг 6 из 8 · {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b>"
    image: "shots/g6-reserve-bridge.jpg"
    text: >-
      Такое бывает, это поправимо. Есть резервные даты — уточните их в школе
      прикрепления и подайте заявление заранее.
    reminders:
      waitingScreens: [g6_retry]
      schedule:
        - { afterHours: 336, screen: g6_result }
    buttons:
      - { label: "Понятно", data: g6_retry.ok, next: wait }
    menu: true

  # ─────────── Путь выпускника · Шаг 7. Экзамены и результаты ───────────

  - id: g7_1
    stage: graduate_exams
    stepLabel: "<b>Шаг 7 из 8 · Экзамены</b>"
    image: "shots/g7-exam-building.jpg"
    text: >-
      ✦ <b>Допуск получен.</b> Дальше — {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}} по графику
      Рособрнадзора. Экзамен проходит не в школе прикрепления: пункт назначает
      экзаменационная комиссия, а школа пришлёт уведомление с датой и адресом.
    buttons:
      - { label: "Понятно", data: g7_1.ok, next: wait }
    menu: true

  # ✎ Дата примерная (≈ 15.04) — календарь на g_map.
  - id: g7_notice
    stage: graduate_exams
    stepLabel: "<b>Шаг 7 из 8 · Экзамены</b>"
    image: "shots/g7-exam-building.jpg"
    text: "Уведомление с датой и адресом пункта проведения уже пришло?"
    buttons:
      - { label: "Да", data: g7_notice.yes, next: g7_day }
      - { label: "Ещё нет", data: g7_notice.no, next: g7_ask }
    menu: true

  - id: g7_day
    stage: graduate_exams
    stepLabel: "<b>Шаг 7 из 8 · Экзамены</b>"
    image: "shots/g7-exam-morning.jpg"
    text: >-
      Главное в день экзамена — документ, удостоверяющий личность: без него
      не допустят. Удачи вашему герою!
    buttons:
      - { label: "Спасибо", data: g7_day.ok, next: wait }
    menu: true

  - id: g7_ask
    stage: graduate_exams
    stepLabel: "<b>Шаг 7 из 8 · Экзамены</b>"
    image: "shots/g7-exam-building.jpg"
    text: >-
      Уведомление приходит через школу прикрепления — уточните у неё. Спрошу
      ещё раз через неделю.
    reminders:
      waitingScreens: [g7_ask]
      schedule:
        - { afterHours: 168, screen: g7_notice, rearm: true }
    buttons:
      - { label: "Понятно", data: g7_ask.ok, next: wait }
    menu: true

  # ✎ Дата примерная (≈ 01.07) — календарь на g_map. «Пока нет» — спросим
  # снова через неделю.
  - id: g7_results
    stage: graduate_exams
    stepLabel: "<b>Шаг 7 из 8 · Результаты</b>"
    image: "shots/g7-results-scroll.jpg"
    text: >-
      Результаты приходят через школу прикрепления или в кабинет mos.ru — туда,
      куда подавали заявление. Если с баллами не согласны, можно подать
      апелляцию: сроки узнайте в школе сразу после экзамена.
    reminders:
      waitingScreens: [g7_results]
      schedule:
        - { afterHours: 168, screen: g7_results, rearm: true }
    buttons:
      - { label: "Результаты есть", data: g7_results.yes, next: g8_1 }
      - { label: "Пока нет", data: g7_results.no, next: wait }
    menu: true

  # ─────────── Путь выпускника · Шаг 8. Аттестат ───────────

  - id: g8_1
    stage: graduate_certificate
    stepLabel: "<b>Шаг 8 из 8 · Аттестат</b>"
    image: "shots/g8-certificate-door.jpg"
    text: |-
      Аттестат выдаёт школа, к которой ваш герой прикреплён для экзаменов. Дождитесь приглашения на вручение и уточните, какие документы взять.

      Оценка в аттестат — {{#if grade11}}среднее всех годовых и полугодовых оценок за 10 и 11 класс{{else}}среднее между оценкой за промежуточную аттестацию и за ОГЭ{{/if}}.
    buttons:
      - { label: "Аттестат получен", data: g8_1.done, next: g8_done }
    menu: true

  - id: g8_done
    stage: graduate_certificate
    stepLabel: "<b>Шаг 8 из 8 · Аттестат</b>"
    terminal: true
    image: "shots/g8-summit.jpg"
    text: >-
      ✦ <b>Путь выпускника пройден.</b> Аттестат в руках — поздравляем вашего героя!
    menu: true
