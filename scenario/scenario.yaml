# Сценарий бота «Зачисление в школу». Единственное место, где живут тексты
# и кнопки — см. п.1 CLAUDE.md и docs/spec.md. Проверяется командой
# `npm run scenario:check` (scripts/check-scenario.ts + scenario/schema.ts).
#
# Покрыты разделы 2–4 docs/spec.md: Старт (S0–S6) и Этапы 1–2 (E1.x, E2.x).
# Этапы 3–6 (раздел 6 спеки) и постоянное меню (раздел 5) — следующий заход,
# см. docs/spec.md, раздел 8.9, пункты 6–8.
#
# Спецпереходы (next), не являющиеся screen_id: menu, stop, kc, defer_to_stage2.
# Текст поддерживает {{#if field}}..{{else}}..{{/if}} — рендерит движок.
# Текст также поддерживает простую HTML-разметку Telegram — <b>жирный</b> —
# для заголовков и важных мест (движок шлёт с parse_mode: HTML, см.
# src/bot/engine.service.ts). Экранировать «», →, тире и т.п. не нужно —
# это не MarkdownV2, спецсимволы только `<`, `>`, `&`, которых в текстах нет.
#
# "Написать в КС" — ВЕЗДЕ прямая ссылка (url:), без промежуточного
# сообщения-переходника. Экран system.kc оставлен только потому, что схема
# требует все SYSTEM_SCREEN_KEYS — реально им никто больше не пользуется.
#
# Тексты "готовых ответов" в E1.4.* и путь `image:` — черновые, отмечены ✎
# там, где формулировку/скриншот ещё должен подтвердить заказчик (для них
# нет прямого источника в инструкции — см. ниже).
#
# Основано на пошаговой инструкции заказчика «Зачисление в школу», тариф
# «Базовый Круглый год», 1–8 и 10 класс, 2026/2027 уч. год (PDF, август
# 2026) — это теперь основной источник формулировок и сроков для экранов
# S6, E1.1, E1.6, E1.7, E2.0, E2.5. Даты в S6 (15 и 31 августа 2027) —
# конкретно под эту когорту, не подставлять как общее правило.

version: "0.1.0"

# Системные экраны-оверлеи (раздел 5 спеки + «Старые кнопки» из раздела 1).
# Не входят в карту пути: переход на них не меняет stage пользователя,
# кроме stop, который реально стирает данные (S1a «Удалить мои данные»).
system:
  # Больше никем не используется: раньше "Написать в КС" сначала показывала
  # этот экран-переходник и только потом ссылку — по просьбе заказчика клик
  # теперь ВЕЗДЕ сразу ссылка (см. url: у самих кнопок ниже по файлу),
  # без промежуточного дублирующего сообщения. Оставлен только потому, что
  # схема (scenario/schema.ts) требует все ключи SYSTEM_SCREEN_KEYS.
  kc:
    text: >-
      Опишу коллегам из службы сопровождения, на каком вы шаге —
      не придётся пересказывать заново.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  menu:
    image: "shots/menu-control-podium.jpg"
    text: "☰ <b>Меню</b>"
    buttons:
      - { label: "Статус зачисления", data: menu.status, next: status }
      - { label: "Мои аттестации", data: menu.subjects, next: in_progress }
      - { label: "Важные сроки", data: menu.dates, next: in_progress }
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  stop:
    text: >-
      Готово, ваши данные удалены. Если передумаете — просто напишите
      /start, и мы начнём с самого начала.

  stale:
    text: >-
      Этот шаг вы уже прошли, данные никуда не делись. Показать вам
      актуальный экран?
    buttons:
      - { label: "Да, к текущему шагу", data: stale.resume, next: current_screen }
      - { label: "Показать статус", data: stale.status, next: status }

  phone_invalid:
    text: >-
      Не получилось распознать номер. Проверьте формат (например,
      +7 900 000-00-00) и отправьте ещё раз.

  in_progress:
    image: "shots/in-progress-beacon.jpg"
    text: >-
      Этот раздел откроется чуть позже, вместе с этапами 3–6 — сейчас
      я его для вас готовлю.

  # Путь выпускника заканчивается аттестатом (g8_done), а не зачислением.
  status_complete:
    text: >-
      {{#if isGraduate}}✦ Путь выпускника пройден — аттестат получен.
      Поздравляем вашего героя!{{else}}✦ Всё хорошо — оба обязательных шага
      пройдены, ваш герой уже официально зачислен! Дальше год спокойный:
      я сам напомню, когда подойдёт время аттестаций и справки.{{/if}}

screens:
  # ───────────────────────── Старт (раздел 2 спеки) ─────────────────────────

  - id: s0
    stage: start
    image: "shots/s0-welcome-letter.jpg"
    text: >-
      Спасибо за оплату! Впереди несколько шагов — я проведу вас
      по каждому и не дам потерять сроки.
    buttons:
      - { label: "Что мне нужно сделать", data: s0.begin, next: s1 }

  - id: s1
    stage: start
    image: "shots/s1-s1a-data-shield.jpg"
    text: >-
      Чтобы вести вас по шагам и ничего не упустить, мне нужно
      сохранять ваши ответы. Подробности — в политике обработки данных.
    buttons:
      - { label: "Согласен, продолжить", data: s1.ok, next: s2 }
      - { label: "Подробнее о данных", data: s1.info, next: s1a }

  - id: s1a
    stage: start
    image: "shots/s1-s1a-data-shield.jpg"
    text: >-
      Храним только необходимое: имя, телефон, Telegram ID, пакет,
      класс, статус, ваши ответы по шагам и отметки чек-листов —
      год хранения. Видят их секретариат и клиентский сервис, и только в рамках
      вашего зачисления.
    buttons:
      - { label: "Согласен, продолжить", data: s1a.ok, next: s2 }
      - { label: "Удалить мои данные", data: s1a.wipe, next: stop }
    back: s1

  - id: s2
    stage: start
    image: "shots/s2-name-patch.jpg"
    text: "Как к вам обращаться?"
    input:
      field: name
      # ВРЕМЕННО: было next: s2b (шаг с телефоном). По просьбе — телефон
      # больше не спрашиваем, экран s2b остаётся в файле нетронутым на
      # случай возврата. Чтобы включить обратно — вернуть next: s2b.
      next: s3
      validation: none
    back: s1

  # ВРЕМЕННО НЕДОСТИЖИМ: на этот экран больше никто не ведёт (см. s2.input.next
  # выше) — оставлен как есть на случай, если понадобится вернуть шаг с
  # телефоном. Сам по себе экран рабочий, просто в него не попасть.
  - id: s2b
    stage: start
    image: "shots/s2b-signal-beacon.jpg"
    text: >-
      Оставьте номер — по нему коллеги из клиентского сервиса смогут вас найти,
      если вдруг понадобится помощь.
    input:
      field: phone
      next: s3
      validation: phone
      maxAttempts: 2
      skipButton: { label: "Пропустить", data: s2b.skip, next: s3 }
    back: s2

  - id: s3
    stage: start
    image: "shots/s3-s3a-cape-choice.jpg"
    text: "Какой пакет вы приобрели?"
    buttons:
      # ВРЕМЕННО: было next: s4 (шаг с классом). Класс больше не спрашиваем —
      # экран s4 остаётся в файле нетронутым, вернуть можно строкой ниже.
      - { label: "Базовый", data: s3.base, next: s5, setField: { field: package, value: "Базовый" } }
      - { label: "Выпускник", data: s3.graduate, next: g_class, setField: { field: package, value: "Выпускник" } }
      - { label: "Другой", data: s3.other, next: s3a, setField: { field: package, value: "Другой" } }
    back: s2

  - id: s3a
    stage: start
    image: "shots/s3-s3a-cape-choice.jpg"
    text: >-
      Сценарий для вашего пакета мы ещё готовим. А пока могу
      показать ключевые даты — они общие для всех пакетов.
    buttons:
      - { label: "Важные сроки", data: s3a.dates, next: menu }
      - { label: "Сообщить, когда будет готово", data: s3a.waitlist, next: menu }
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
    back: s3

  # ВРЕМЕННО НЕДОСТИЖИМ: на этот экран больше никто не ведёт (см. кнопку
  # "Базовый" на s3 выше) — оставлен как есть на случай, если понадобится
  # вернуть шаг с выбором класса.
  - id: s4
    stage: start
    image: "shots/s4-nine-class-doors.jpg"
    text: "В какой класс зачисляетесь?"
    grid: true
    buttons:
      - { label: "1", data: s4.k1, next: s5, setField: { field: class, value: "1" } }
      - { label: "2", data: s4.k2, next: s5, setField: { field: class, value: "2" } }
      - { label: "3", data: s4.k3, next: s5, setField: { field: class, value: "3" } }
      - { label: "4", data: s4.k4, next: s5, setField: { field: class, value: "4" } }
      - { label: "5", data: s4.k5, next: s5, setField: { field: class, value: "5" } }
      - { label: "6", data: s4.k6, next: s5, setField: { field: class, value: "6" } }
      - { label: "7", data: s4.k7, next: s5, setField: { field: class, value: "7" } }
      - { label: "8", data: s4.k8, next: s5, setField: { field: class, value: "8" } }
      - { label: "10", data: s4.k10, next: s5, setField: { field: class, value: "10" } }
    back: s3

  - id: s5
    stage: start
    image: "shots/s5-garden-fork.jpg"
    text: "Вы у нас впервые или уже учились?"
    buttons:
      - { label: "Впервые", data: s5.new, next: s6, setField: { field: isReturning, value: "false" } }
      - { label: "Уже учились", data: s5.ret, next: s6, setField: { field: isReturning, value: "true" } }
    back: s3

  - id: s6
    stage: start
    image: "shots/s6-six-beacons-map.jpg"
    # Даты 4/6 — под когорту 2026/2027 (тариф «Базовый Круглый год», см.
    # инструкцию заказчика). Когда появятся этапы 3–6 с их напоминаниями
    # (раздел 8.9 CLAUDE.md, п.8) — заменить на подстановку по cohort_year,
    # а не хардкодить год на будущее.
    text: |-
      Спасибо за ответы! У нас есть ещё несколько шагов впереди — ничего сложного, разберёмся вместе.

      Вот как выглядит весь путь:
      <b>1. Доступ к платформе</b> — 1 день после оплаты
      <b>2. Зачисление в школу</b> — 10 дней
      <b>3. Учёба и прогресс</b> — весь учебный год
      <b>4. Аттестации и завершение класса</b> — до 15 августа 2027
      <b>5. Итоговая справка</b> — 3 дня после завершения
      <b>6. Продление со скидкой</b> — до 31 августа 2027

      Начнём с первых двух — это займёт всего несколько минут.
    buttons:
      - { label: "Начинаем", data: s6.go, next: e1_1 }
    back: s5

  # ─────────────────── Этап 1. Доступ к платформе (раздел 3) ───────────────────

  - id: e1_1
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-1-key-at-gate.jpg"
    text: >-
      {{#if isReturning}}Вы уже учились у нас, так что войти можно
      по прежним данным. Получилось?{{else}}Вам должны были прислать
      логин и пароль от платформы — письмом на почту плательщика,
      в день оплаты. Письмо пришло?{{/if}}
    buttons:
      - { label: "Да", data: e1_1.yes, next: e1_3 }
      - { label: "Нет", data: e1_1.no, next: e1_2 }
    back: s6
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_2
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Такие письма иногда улетают в спам. Загляните в папку «Спам» —
      возможно, оно там.
    buttons:
      - { label: "Нашёл", data: e1_2.found, next: e1_3 }
      - { label: "Там пусто", data: e1_2.empty, next: e1_2a }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_2a
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Похоже, письмо не приходило. Не переживайте — служба
      сопровождения поможет разобраться, она уже видит, на каком вы шаге.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
      - { label: "Я разберусь позже", data: e1_2a.later, next: e2_0 }
    menu: true

  - id: e1_3
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-3-gate-opens.jpg"
    text: "Теперь попробуйте войти на платформу по этим данным. Получилось?"
    buttons:
      - { label: "Да, я внутри", data: e1_3.yes, next: e1_5 }
      - { label: "Не получается", data: e1_3.no, next: e1_4 }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_4
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-4-diagnostics-panel.jpg"
    text: "Расскажите, что не так — так будет проще помочь."
    buttons:
      - { label: "Не подходит пароль", data: e1_4.password, next: e1_4_password }
      - { label: "Страница не открывается", data: e1_4.page, next: e1_4_page }
      - { label: "Не понимаю, куда нажимать", data: e1_4.confused, next: e1_4_confused }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_4_password
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-4-fix-on-site.jpg"
    # «Уже учились» — пароль можно восстановить и в личном кабинете (по просьбе
    # от 29.09). Впервые пришедшим личного кабинета ещё нет — им только «Забыли пароль».
    text: >-
      ✎ {{#if isReturning}}Пароль можно восстановить в личном кабинете или нажать
      «Забыли пароль» на странице входа — новый придёт на ту же почту.{{else}}Попробуйте
      нажать «Забыли пароль» на странице входа — новый придёт на ту же почту.{{/if}}
    buttons:
      - { label: "Да", data: e1_4_password.yes, next: e1_5 }
      - { label: "Нет, напишу в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: e1_4_page
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-4-fix-on-site.jpg"
    text: "✎ Попробуйте обновить страницу или открыть её в другом браузере — обычно это помогает."
    buttons:
      - { label: "Да", data: e1_4_page.yes, next: e1_5 }
      - { label: "Нет, напишу в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: e1_4_confused
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-4-fix-on-site.jpg"
    text: "✎ После входа найдите и нажмите на плитку в центре экрана — это и есть вход в Город."
    buttons:
      - { label: "Да", data: e1_4_confused.yes, next: e1_5 }
      - { label: "Нет, напишу в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: e1_5
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-5-first-city-reveal.jpg"
    text: "Вот вы и в Городе — так выглядит платформа изнутри. Как вам первое впечатление?"
    buttons:
      - { label: "Нравится", data: e1_5.like, next: e1_6 }
      - { label: "Пока непонятно", data: e1_5.unclear, next: e1_5b }
    menu: true

  - id: e1_5b
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-5b-thought-bubble.jpg"
    text: "Что смущает? Опишите в двух словах — учтём."
    input:
      field: city_feedback
      next: e1_5c
      validation: none

  - id: e1_5c
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-5c-lighthouse-guide.jpg"
    text: >-
      Спасибо за отзыв! Освоиться помогает экскурсия по Городу —
      пройдите её вместе с героем, будет проще.
    buttons:
      - { label: "Спасибо, посмотрю", data: e1_5c.ok, next: e1_6 }

  - id: e1_6
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-6-school-building.jpg"
    text: >-
      Зайдите в здание «<b>Школа</b>» → кабинет «Информация для старта» —
      там весь гайд по обучению: как устроена платформа, сроки
      обучения и аттестаций, правила оценок.
    buttons:
      - { label: "Нашёл", data: e1_6.found, next: e1_7 }
      - { label: "Не нашёл", data: e1_6.notfound, next: e1_6b }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_6b
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    text: >-
      Откройте здание «<b>Школа</b>», затем кабинет «Информация для
      старта» — вот как это выглядит.
    image: "✎ shots/e1_6b_school_info.png"
    buttons:
      - { label: "Дальше", data: e1_6b.ok, next: e1_7 }

  - id: e1_7
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-7-access-open.jpg"
    text: >-
      ✦ <b>Доступ открыт.</b> Вы разобрались, как всё устроено, —
      ваш герой готов приступить к занятиям.
    buttons:
      - { label: "Дальше — к зачислению", data: e1_7.next, next: e2_0 }

  # ─────────────────── Этап 2. Официальное зачисление (раздел 4) ───────────────────

  - id: e2_0
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-0-two-archways.jpg"
    text: |-
      Переходим к официальному зачислению — рекомендуем уложиться в 10 дней. Не потому что что-то пропадёт, а потому что справка готовится не мгновенно.

      Дальше вас ждут два этапа:
      <b>1. Личные документы</b> — то, что нужно отправить от вас.
      <b>2. Подписание документов со школой</b> — школа пришлёт документы, вам останется их подписать.

      Расскажу подробно про каждый — начнём с первого.
    buttons:
      - { label: "Понятно, начинаем", data: e2_0.ok, next: e2_1 }
    back: s6
    menu: true

  - id: e2_1
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-1-document-scroll.jpg"
    text: "Вам должно было прийти письмо со списком необходимых документов. Оно пришло?"
    buttons:
      - { label: "Да", data: e2_1.yes, next: e2_2 }
      - { label: "Нет", data: e2_1.no, next: e2_1_spam }
      - { label: "Пока пройду шаг с платформой", data: e2_1.to_stage1, next: e1_1 }
    menu: true

  - id: e2_1_spam
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Такие письма иногда улетают в спам. Загляните в папку «Спам» —
      возможно, оно там.
    buttons:
      - { label: "Нашёл", data: e2_1_spam.found, next: e2_2 }
      - { label: "Там пусто", data: e2_1_spam.empty, next: e2_1_kc }
    menu: true

  - id: e2_1_kc
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Похоже, письмо не приходило. Не переживайте — служба
      сопровождения поможет разобраться, она уже видит, на каком вы шаге.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
      - { label: "Я разберусь позже", data: e2_1_kc.later, next: e2_2 }
    menu: true

  - id: e2_2
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2-mail-drone.jpg"
    text: >-
      {{#if isReturning}}Раз вы уже учились у нас, нужны только
      недостающие документы — то, чего не хватало в прошлый раз.
      Вы их отправили?{{else}}Соберите документы по списку из письма
      и отправьте их по инструкции — этого шага не миновать. Уже
      отправили?{{/if}}
    buttons:
      - { label: "Да, отправил", data: e2_2.yes, next: e2_2_sent }
      - { label: "Ещё нет", data: e2_2.no, next: e2_2a }
    menu: true

  # Пинг после отправки документов — по замечанию клиентского сервиса.
  # Раньше бот спрашивал «документы школы уже пришли?» сразу же, хотя школа
  # к этому моменту ещё даже не начала проверку. Теперь: сначала сообщаем,
  # что документы в работе и ответ придёт почтой, а вопрос про письмо
  # задаём напоминаниями через сутки и через двое (см. reminders ниже).
  - id: e2_2_sent
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2-mail-drone.jpg"
    text: |-
      Документы получены — забрали их в работу. Сейчас проверяем, всё ли на месте.

      Ответ придёт вам <b>на почту</b>: если всё в порядке, следующим письмом будут документы на подпись. Я загляну напомнить, чтобы письмо не потерялось.
    reminders:
      # Пока родитель здесь или в любой из веток «письма нет» — вопрос открыт.
      # Как только он подтвердил, что письмо пришло (e2_4 и дальше), оставшиеся
      # напоминания снимаются сами, без отдельного действия.
      waitingScreens: [e2_2_sent, e2_3, e2_3_spam, e2_3_wait, e2_3_ping2, e2_3_kc]
      schedule:
        - { afterHours: 24, screen: e2_3 }
        - { afterHours: 48, screen: e2_3_ping2 }
    buttons:
      - { label: "Проверить почту сейчас", data: e2_2_sent.check, next: e2_3 }
    menu: true

  - id: e2_2a
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2a-checklist-question.jpg"
    text: "Расскажите, что мешает — разберёмся вместе."
    buttons:
      - { label: "Не хватает документа", data: e2_2a.missing_doc, next: e2_2a_missing }
      - { label: "Не понял, что нужно", data: e2_2a.unclear_list, next: e2_2a_list }
      - { label: "Не понял, куда слать", data: e2_2a.unclear_where, next: e2_2a_where }
      - { label: "Нужно время", data: e2_2a.need_time, next: e2_2a_time }

  - id: e2_2a_missing
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2a-document-sorting.jpg"
    text: >-
      ✎ Часто дело в мелочах: документ оформлен не на того родителя,
      нет прописки, устаревшее фото. Если не ваш случай —
      поможем разобраться в клиентском сервисе.
    buttons:
      - { label: "Разобрался", data: e2_2a_missing.ok, next: e2_2 }
      - { label: "Нужна помощь клиентского сервиса", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: e2_2a_list
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2a-document-sorting.jpg"
    text: |-
      Вот что нужно сделать:
      1) Откройте письмо со списком документов.
      2) Сверьте его с чек-листом на платформе.
      3) Соберите всё одним архивом.
    buttons:
      - { label: "Понятно", data: e2_2a_list.ok, next: e2_2 }

  - id: e2_2a_where
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2a-document-sorting.jpg"
    text: |-
      Вот куда их отправить:
      1) Зайдите в <b>Секретариат</b>.
      2) Откройте «<b>Загрузка документов</b>».
      3) Прикрепите файлы и нажмите «Отправить».
    buttons:
      - { label: "Понятно", data: e2_2a_where.ok, next: e2_2 }

  - id: e2_2a_time
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-2a-document-sorting.jpg"
    text: "Хорошо, не буду торопить. Когда вам напомнить об этом?"
    buttons:
      - { label: "Напомнить завтра", data: e2_2a_time.tomorrow, next: e2_2 }
      - { label: "Через 3 дня", data: e2_2a_time.in3days, next: e2_2 }

  - id: e2_3
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-3-school-envelope.jpg"
    # Первое напоминание (через сутки после отправки документов) и он же —
    # экран по кнопке «Проверить почту сейчас» с e2_2_sent.
    text: >-
      Загляните в почту: пришло ли письмо от нас с документами
      на подпись?
    buttons:
      - { label: "Да, пришло", data: e2_3.yes, next: e2_4 }
      - { label: "Письма нет", data: e2_3.no, next: e2_3_spam }
    menu: true

  # Подсказка про другие папки — первое, что нужно проверить, прежде чем
  # звать клиентский сервис.
  - id: e2_3_spam
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: |-
      Загляните в папки <b>«Спам»</b> и <b>«Промоакции»</b> — письма с вложениями часто уезжают туда.

      И проверьте, что смотрите тот же ящик, на который оформляли оплату.
    buttons:
      - { label: "Нашёл письмо", data: e2_3_spam.found, next: e2_4 }
      - { label: "Там тоже пусто", data: e2_3_spam.empty, next: e2_3_wait }

  - id: e2_3_wait
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-wait-countdown.jpg"
    text: >-
      Хорошо, подожду вместе с вами — загляну ещё раз позже.
      Если письмо появится раньше, нажмите кнопку ниже.
    buttons:
      - { label: "Письмо пришло", data: e2_3_wait.found, next: e2_4 }
    menu: true

  # Второе (последнее) напоминание — через двое суток. Текст намеренно другой:
  # дословный повтор первого читался бы как сбой рассылки.
  - id: e2_3_ping2
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-3-school-envelope.jpg"
    text: >-
      Ещё раз про письмо со школьными документами — оно так и не
      появилось? Проверьте и входящие, и папку со спамом.
    buttons:
      - { label: "Да, пришло", data: e2_3_ping2.yes, next: e2_4 }
      - { label: "Так и не пришло", data: e2_3_ping2.no, next: e2_3_kc }
    menu: true

  # Два напоминания прошли, письма нет — дальше вопрос решают руками.
  - id: e2_3_kc
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Похоже, письмо действительно не дошло. Напишите в клиентский
      сервис — коллеги видят, на каком вы шаге, и разберутся с почтой.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
      - { label: "Письмо всё-таки нашлось", data: e2_3_kc.found, next: e2_4 }
    menu: true

  - id: e2_4
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-4-glowing-quill.jpg"
    text: |-
      Подпишите документы. Отправьте сканированные копии или качественные фотографии через кнопку из письма.

      <i>Не отправляйте ответным письмом — мы не сможем их получить.</i>
    buttons:
      - { label: "Направил", data: e2_4.yes, next: e2_5 }
      - { label: "Ещё нет", data: e2_4.no, next: e2_4_wait }
    menu: true

  - id: e2_4_wait
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-wait-countdown.jpg"
    text: "Хорошо, не буду торопить. Когда вам напомнить об этом?"
    buttons:
      - { label: "Напомнить завтра", data: e2_4_wait.tomorrow, next: e2_4 }
      - { label: "Через 3 дня", data: e2_4_wait.in3days, next: e2_4 }

  - id: e2_5
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    image: "shots/e2-5-archive-tower.jpg"
    text: >-
      Готово! Дальше всё делаем мы: справка появится в <b>Секретариате</b> →
      «<b>Справки</b>». Готовится 3 дня после подачи, но не раньше <b>10 сентября</b> —
      скачивать ничего не нужно, просто держите это в уме.
    buttons:
      - { label: "Что дальше?", data: e2_5.next, next: e2_6 }

  - id: e2_6
    stage: stage2_enrollment
    stepLabel: "<b>Шаг 2 из 6 · Зачисление в школу</b>"
    terminal: true
    image: "shots/e2-6-path-open.jpg"
    text: >-
      ✦ <b>Путь открыт.</b> Два шага из шести позади — и это были
      самые срочные. Дальше год спокойный: я сам напомню про
      аттестации и справку, когда придёт время.
    buttons:
      - { label: "Посмотреть чек-лист аттестаций", data: e2_6.checklist, next: menu }
      - { label: "Важные сроки", data: e2_6.dates, next: menu }
    menu: true

  # ═══════════════════════════ ПУТЬ ВЫПУСКНИКА (9 и 11 класс) ═══════════════════════════
  #
  # Отдельная ветка от кнопки «Выпускник» на s3. С базовым путём больше не
  # пересекается: этапы 1–2 — свои копии (g1_*, g2_*), дальше шаги 3–8 по
  # памяткам «Путь выпускника на семейном обучении» 2026/2027.
  # Макет и решения — docs/graduate/Путь_выпускника.md.
  #
  # Тексты ОГЭ/ЕГЭ — один экран с {{#if grade11}}…{{else}}…{{/if}}: grade11
  # движок выставляет по полю class (его пишет g_class).

  - id: g_class
    stage: graduate_start
    image: "shots/g-class-two-towers.jpg"
    text: "В каком классе ваш герой?"
    buttons:
      - { label: "9 класс · ОГЭ", data: g_class.k9, next: g_s5, setField: { field: class, value: "9" } }
      - { label: "11 класс · ЕГЭ", data: g_class.k11, next: g_s5, setField: { field: class, value: "11" } }
    back: s3

  - id: g_s5
    stage: graduate_start
    image: "shots/s5-garden-fork.jpg"
    text: "Вы у нас впервые или уже учились?"
    buttons:
      - { label: "Впервые", data: g_s5.new, next: g_map, setField: { field: isReturning, value: "false" } }
      - { label: "Уже учились", data: g_s5.ret, next: g_map, setField: { field: isReturning, value: "true" } }
    back: g_class

  # Календарь выпускника ставится здесь, одним списком: через g_map проходят
  # все выпускники, и класс к этому моменту уже известен (forClass).
  # Напоминание уходит, только если в свой день родитель ещё на шагах,
  # к которым оно относится (waitingScreens у каждой даты) — сделал шаг
  # раньше, и оно молча снимается.
  # minDaysFromStart: 0 — это дедлайны, правило «не ближе 14 дней от старта»
  # для них отключено (иначе пришедший 5 ноября не услышит о сроке 18 ноября).
  # Даты с ✎ примерные: в памятках для них указан только месяц.
  - id: g_map
    stage: graduate_start
    image: "shots/g-map-graduate-road.jpg"
    text: |-
      Спасибо за ответы! Впереди путь выпускника — пройдём его по шагам.

      <b>1. Доступ к платформе</b> — 1 день после оплаты
      <b>2. Зачисление в школу</b> — 10 дней
      <b>3. Прикрепление к школе для экзамена</b> — осень 2026
      <b>4. Заявления на {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}}</b> — с 1 октября 2026
      <b>5. Подготовка и пробники</b> — осень – весна
      <b>6. {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b> — {{#if grade11}}2 декабря 2026{{else}}10 февраля 2027{{/if}}
      <b>7. Экзамены и результаты</b> — весна – лето 2027
      <b>8. Аттестат</b> — лето 2027

      Начнём с первых двух — это займёт несколько минут.
    reminders:
      waitingScreens: [g_map]
      schedule:
        # Открылся приём заявлений на экзамен и допуск.
        - at: "2026-10-01"
          minDaysFromStart: 0
          screen: g4_1
          waitingScreens: &before_applied [g2_6, g3_0, g3_1, g3_how, g3_later, g4_1, g4_how, g4_later]
        # 11: заявление на сочинение принимают до 18 ноября.
        - at: "2026-11-11"
          minDaysFromStart: 0
          forClass: ["11"]
          screen: g4_1
          waitingScreens: *before_applied
        # 11: итоговое сочинение 2 декабря.
        - at: "2026-11-25"
          minDaysFromStart: 0
          forClass: ["11"]
          screen: g6_1
          waitingScreens: &before_admission [g2_6, g3_0, g3_1, g3_how, g3_later, g4_1, g4_how, g4_later, g5_1, g5_mcko, g5_res, g5_wait, g5_dates]
        # ✎ ≈ 15.12: опубликовано расписание ОГЭ / ЕГЭ. У 11 класса к этому
        # времени сочинение позади — они ждут результата на шаге 6.
        - at: "2026-12-15"
          minDaysFromStart: 0
          screen: g5_dates
          waitingScreens: [g2_6, g3_0, g3_1, g3_how, g3_later, g4_1, g4_how, g4_later, g5_1, g5_mcko, g5_res, g5_wait, g6_ready, g6_late, g6_retry]
        # ✎ ≈ 16.12, 11: как прошло сочинение.
        - at: "2026-12-16"
          minDaysFromStart: 0
          forClass: ["11"]
          screen: g6_result
          waitingScreens: [g5_wait, g5_dates, g6_ready, g6_late, g6_retry]
        # 9: заявление на собеседование принимают до 27 января.
        - at: "2027-01-20"
          minDaysFromStart: 0
          forClass: ["9"]
          screen: g4_1
          waitingScreens: *before_applied
        # 9: итоговое собеседование 10 февраля.
        - at: "2027-02-03"
          minDaysFromStart: 0
          forClass: ["9"]
          screen: g6_1
          waitingScreens: *before_admission
        # ✎ ≈ 24.02, 9: как прошло собеседование.
        - at: "2027-02-24"
          minDaysFromStart: 0
          forClass: ["9"]
          screen: g6_result
          waitingScreens: [g6_ready, g6_late, g6_retry]
        # ✎ ≈ 15.04: пришло ли уведомление о пункте проведения.
        - at: "2027-04-15"
          minDaysFromStart: 0
          screen: g7_notice
          waitingScreens: [g7_1]
        # ✎ ≈ 01.07: результаты экзаменов.
        - at: "2027-07-01"
          minDaysFromStart: 0
          screen: g7_results
          waitingScreens: [g7_1, g7_notice, g7_ask, g7_day]
    buttons:
      - { label: "Начинаем", data: g_map.go, next: g1_1 }
    back: g_s5

  # ─────────── Путь выпускника · Шаг 1. Доступ к платформе ───────────
  # Копия этапа 1 (e1_*): тот же порядок экранов и ветки помощи. Отличаются
  # «Шаг 1 из 8» и «Зайду на платформу позже» — ведёт в зачисление
  # выпускника (g2_0), а не в общее. Копии свои — правятся независимо.

  - id: g1_1
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-1-key-at-gate.jpg"
    text: >-
      {{#if isReturning}}Вы уже учились у нас, так что войти можно
      по прежним данным. Получилось?{{else}}Вам должны были прислать
      логин и пароль от платформы — письмом на почту плательщика,
      в день оплаты. Письмо пришло?{{/if}}
    buttons:
      - { label: "Да", data: g1_1.yes, next: g1_3 }
