# Сценарий бота «Зачисление в школу». Единственное место, где живут тексты
# и кнопки — см. п.1 CLAUDE.md и docs/spec.md. Проверяется командой
# `npm run scenario:check` (scripts/check-scenario.ts + scenario/schema.ts).
#
# Этот файл — общее для всех тарифов: системные экраны, старт (S0–S6, выбор
# тарифа и класса) и тариф «Базовый» для 1–8 и 10 класса целиком (шаги 1–6).
# Ветки остальных тарифов — отдельными файлами в scenario/tariffs/*.yaml,
# склеиваются при загрузке (scenario/load.ts):
#   bazovy-bez-gia.yaml     — «Базовый», 9 и 11 класс без ГИА (g*)
#   bazovy-s-gia.yaml       — «Базовый с ГИА», 9 и 11 класс (bg*)
#   klassny-vypusknik.yaml  — «Классный Выпускник», 9 и 11 класс (kg*)
#   klassny-1-8-10.yaml     — «Классный», 1–8 и 10 класс (kb*)
#
# Спецпереходы (next), не являющиеся screen_id: menu, stop, kc, defer_to_stage2.
# Текст поддерживает {{#if field}}..{{else}}..{{/if}} — рендерит движок.
# Текст также поддерживает простую HTML-разметку Telegram — <b>жирный</b> —
# для заголовков и важных мест (движок шлёт с parse_mode: HTML, см.
# src/bot/engine.service.ts). Экранировать «», →, тире и т.п. не нужно —
# это не MarkdownV2, спецсимволы только `<`, `>`, `&`, которых в текстах нет.
#
# "Написать в КС" — ВЕЗДЕ прямая ссылка (url:), без промежуточного
# сообщения-переходника. Экран system.kc оставлен только потому, что схема
# требует все SYSTEM_SCREEN_KEYS — реально им никто больше не пользуется.
#
# Тексты "готовых ответов" в E1.4.* и путь `image:` — черновые, отмечены ✎
# там, где формулировку/скриншот ещё должен подтвердить заказчик (для них
# нет прямого источника в инструкции — см. ниже).
#
# Основано на пошаговой инструкции заказчика «Зачисление в школу», тариф
# «Базовый Круглый год», 1–8 и 10 класс, 2026/2027 уч. год (PDF, август
# 2026) — это теперь основной источник формулировок и сроков для экранов
# S6, E1.1, E1.6, E1.7, E2.0, E2.5. Шаги 3–6 и сроки (аттестации и продление
# до 31 мая 2027) — по инструкции «Базовый, 1–8 и 10 класс» от 30.09.2026.

version: "0.2.0"

# Флаги для шаблонов текстов: {{#if isGraduate}}…{{/if}} и т.п. Истинны, если
# package родителя — один из перечисленных (пишут кнопки s3, s_gia, k_class).
packageFlags:
  isGraduate: ["Базовый без ГИА", "Базовый с ГИА", "Классный Выпускник"]
  # С ГИА на всех шагах помогает куратор выпускников, а не клиентский сервис.
  hasCurator: ["Базовый с ГИА", "Классный Выпускник", "Классный"]

# Значения для шаблонов по тарифу ({{curatorUrl}}, {{curatorLabel}}).
packageVars:
  curatorUrl:
    "Базовый с ГИА": "https://t.me/giahssc_bot"
    "Классный Выпускник": "https://t.me/giahssc_bot"
    "Классный": "https://t.me/CPSOCLASS_bot"
  curatorLabel:
    "Базовый с ГИА": "Написать куратору выпускников"
    "Классный Выпускник": "Написать куратору выпускников"
    "Классный": "Написать куратору"

# Системные экраны-оверлеи (раздел 5 спеки + «Старые кнопки» из раздела 1).
# Не входят в карту пути: переход на них не меняет stage пользователя,
# кроме stop, который реально стирает данные (S1a «Удалить мои данные»).
system:
  # Больше никем не используется: раньше "Написать в КС" сначала показывала
  # этот экран-переходник и только потом ссылку — по просьбе заказчика клик
  # теперь ВЕЗДЕ сразу ссылка (см. url: у самих кнопок ниже по файлу),
  # без промежуточного дублирующего сообщения. Оставлен только потому, что
  # схема (scenario/schema.ts) требует все ключи SYSTEM_SCREEN_KEYS.
  kc:
    text: >-
      Опишу коллегам из службы сопровождения, на каком вы шаге —
      не придётся пересказывать заново.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  menu:
    image: "shots/menu-control-podium.jpg"
    text: "☰ <b>Меню</b>"
    buttons:
      - { label: "Статус зачисления", data: menu.status, next: status }
      - { label: "Мои аттестации", data: menu.subjects, next: in_progress }
      - { label: "Важные сроки", data: menu.dates, next: in_progress }
      - { label: "{{#if hasCurator}}{{curatorLabel}}{{else}}Написать в клиентский сервис{{/if}}", url: "{{#if hasCurator}}{{curatorUrl}}{{else}}https://t.me/{{kc_username}}?start={{kc_context}}{{/if}}" }

  stop:
    text: |-
      Готово, ваши данные удалены.

      Если передумаете — напишите /start, и начнём сначала.

  stale:
    text: |-
      Этот шаг вы уже прошли — все ответы сохранены.

      <b>Показать актуальный шаг?</b>
    buttons:
      - { label: "Да, к текущему шагу", data: stale.resume, next: current_screen }
      - { label: "Показать статус", data: stale.status, next: status }

  phone_invalid:
    text: |-
      Не получилось распознать номер.

      💡 Пример: +7 900 000-00-00

      Отправьте, пожалуйста, ещё раз.

  in_progress:
    image: "shots/in-progress-beacon.jpg"
    text: |-
      Этот раздел скоро откроется — я его для вас готовлю.

  # Показывается на финальном экране ветки (screen.terminal): у выпускников
  # это аттестат, у «Базового» 1–8 и 10 — завершённый класс и справка.
  status_complete:
    text: |-
      {{#if isGraduate}}✦ <b>Путь выпускника пройден!</b>

      Аттестат получен — поздравляем вашего героя!{{else}}✦ <b>Все шаги этого года пройдены!</b>

      Класс завершён, справка с оценками у вас. Поздравляем вашего героя!{{/if}}

screens:
  # ───────────────────────── Старт (раздел 2 спеки) ─────────────────────────

  - id: s0
    stage: start
    image: "shots/s0-welcome-letter.jpg"
    text: |-
      Спасибо за оплату!

      Впереди несколько шагов — я проведу вас по каждому и напомню о сроках.
    buttons:
      - { label: "Что мне нужно сделать", data: s0.begin, next: s1 }

  - id: s1
    stage: start
    image: "shots/s1-s1a-data-shield.jpg"
    text: |-
      Чтобы вести вас по шагам, мне нужно сохранять ваши ответы.

      Подробности — в политике обработки данных.

      <b>Продолжим?</b>
    buttons:
      - { label: "Согласен, продолжить", data: s1.ok, next: s2 }
      - { label: "Подробнее о данных", data: s1.info, next: s1a }

  - id: s1a
    stage: start
    image: "shots/s1a-data-vault.jpg"
    text: |-
      Храним только необходимое:
      • имя, телефон и Telegram ID;
      • пакет и класс;
      • статус, ответы по шагам и отметки чек-листов.

      Срок хранения — год. Видят данные только секретариат и клиентский сервис — в рамках вашего зачисления.
    buttons:
      - { label: "Согласен, продолжить", data: s1a.ok, next: s2 }
      - { label: "Удалить мои данные", data: s1a.wipe, next: stop }
    back: s1

  - id: s2
    stage: start
    image: "shots/s2-name-patch.jpg"
    text: |-
      Давайте познакомимся!

      <b>Как к вам обращаться?</b>
      Напишите имя в ответ на это сообщение.
    input:
      field: name
      # ВРЕМЕННО: было next: s2b (шаг с телефоном). По просьбе — телефон
      # больше не спрашиваем, экран s2b остаётся в файле нетронутым на
      # случай возврата. Чтобы включить обратно — вернуть next: s2b.
      next: s3
      validation: none
    back: s1

  # ВРЕМЕННО НЕДОСТИЖИМ: на этот экран больше никто не ведёт (см. s2.input.next
  # выше) — оставлен как есть на случай, если понадобится вернуть шаг с
  # телефоном. Сам по себе экран рабочий, просто в него не попасть.
  - id: s2b
    stage: start
    image: "shots/s2b-signal-beacon.jpg"
    text: |-
      Оставьте номер телефона — по нему коллеги из клиентского сервиса найдут вас, если понадобится помощь.

      💡 Пример: +7 900 000-00-00
    input:
      field: phone
      next: s3
      validation: phone
      maxAttempts: 2
      skipButton: { label: "Пропустить", data: s2b.skip, next: s3 }
    back: s2

  - id: s3
    stage: start
    image: "shots/s3-s3a-cape-choice.jpg"
    text: |-
      <b>Какой пакет вы приобрели?</b>
    buttons:
      # Класс спрашиваем уже внутри тарифа (s4b, k_class): от него зависит ветка.
      - { label: "Базовый", data: s3.base, next: s4b, setField: { field: package, value: "Базовый" } }
      - { label: "Классный", data: s3.klassny, next: k_class, setField: { field: package, value: "Классный" } }
      - { label: "Другой", data: s3.other, next: s3a, setField: { field: package, value: "Другой" } }
    back: s2

  # «Базовый»: 1–8 и 10 класс — путь ниже (s5 → e*), 9 и 11 — ещё вопрос про ГИА.
  - id: s4b
    stage: start
    image: "shots/s4-nine-class-doors.jpg"
    text: |-
      <b>В каком классе ваш герой?</b>
    buttons:
      - { label: "1–8 или 10 класс", data: s4b.base, next: s5, setField: { field: class, value: "1–8, 10" } }
      - { label: "9 класс", data: s4b.k9, next: s_gia, setField: { field: class, value: "9" } }
      - { label: "11 класс", data: s4b.k11, next: s_gia, setField: { field: class, value: "11" } }
    back: s3

  # 9 и 11 класс «Базового» — две разные ветки: с ГИА ведёт куратор
  # (tariffs/bazovy-s-gia.yaml), без ГИА семья проходит экзамены сама
  # (tariffs/bazovy-bez-gia.yaml).
  - id: s_gia
    stage: start
    image: "shots/gia-support-choice.jpg"
    text: |-
      В 9 и 11 классе «Базовый» бывает двух видов:
      • <b>с ГИА</b> — куратор сопровождает {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}}: заявки, допуск, экзамены;
      • <b>без ГИА</b> — экзамены семья проходит сама, а я подскажу, что и когда делать.

      <b>Какой у вас пакет?</b>
    buttons:
      - { label: "Базовый с ГИА", data: s_gia.yes, next: bg_s5, setField: { field: package, value: "Базовый с ГИА" } }
      - { label: "Базовый, без ГИА", data: s_gia.no, next: g_s5, setField: { field: package, value: "Базовый без ГИА" } }
      - { label: "Не знаю — спросить", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
    back: s4b

  # «Классный»: 9 и 11 — tariffs/klassny-vypusknik.yaml, 1–8 и 10 — tariffs/klassny-1-8-10.yaml.
  - id: k_class
    stage: start
    image: "shots/s4-nine-class-doors.jpg"
    text: |-
      <b>В каком классе ваш герой?</b>
    buttons:
      - { label: "9 класс", data: k_class.k9, next: kg_s5, setField: [{ field: class, value: "9" }, { field: package, value: "Классный Выпускник" }] }
      - { label: "11 класс", data: k_class.k11, next: kg_s5, setField: [{ field: class, value: "11" }, { field: package, value: "Классный Выпускник" }] }
      - { label: "1–8 или 10 класс", data: k_class.base, next: kb_s5, setField: { field: class, value: "1–8, 10" } }
    back: s3

  - id: s3a
    stage: start
    image: "shots/s3-s3a-cape-choice.jpg"
    text: |-
      Сценарий для вашего пакета ещё готовим.

      А пока могу показать ключевые даты — они общие для всех пакетов.
    buttons:
      - { label: "Важные сроки", data: s3a.dates, next: menu }
      - { label: "Сообщить, когда будет готово", data: s3a.waitlist, next: menu }
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
    back: s3

  - id: s5
    stage: start
    image: "shots/s5-garden-fork.jpg"
    text: |-
      <b>Вы у нас впервые или уже учились?</b>
    buttons:
      - { label: "Впервые", data: s5.new, next: s6, setField: { field: isReturning, value: "false" } }
      - { label: "Уже учились", data: s5.ret, next: s6, setField: { field: isReturning, value: "true" } }
    back: s4b

  - id: s6
    stage: start
    image: "shots/s6-six-beacons-map.jpg"
    # Даты — под когорту 2026/2027 (тариф «Базовый», см.
    # инструкцию заказчика). Когда появятся этапы 3–6 с их напоминаниями
    # (раздел 8.9 CLAUDE.md, п.8) — заменить на подстановку по cohort_year,
    # а не хардкодить год на будущее.
    text: |-
      Спасибо за ответы! Вот весь путь — ничего сложного, пройдём вместе:

      <b>1. Доступ к платформе</b> — после оплаты
      <b>2. Зачисление в школу</b> — около 10 дней
      <b>3. Учёба и прогресс</b> — весь учебный год
      <b>4. Аттестации и завершение класса</b> — до 31 мая 2027
      <b>5. Справка с оценками</b> — после завершения класса
      <b>6. Продление со скидкой</b> — до 31 мая 2027

      Начнём с первых двух — это займёт несколько минут.
    # Календарь «Базового» ставится здесь: через s6 проходят все родители
    # этого тарифа. Аттестации — абсолютные даты из CLAUDE.md (01.03, 01.04,
    # 01.05, 20.05); уходят, только если класс ещё не завершён. Продление —
    # 31.03, 30.04, 20.05, 29.05; показывается поверх любого шага после
    # зачисления и молчит, если родитель уже ответил «Уже продлили».
    reminders:
      waitingScreens: [s6]
      schedule:
        - { at: "2027-03-01", screen: e4_1, waitingScreens: &attest_open [e2_6, e3_1, e3_wait, e4_1, e4_2, e4_3, e4_4, e4_wip, e4_finish, e4_stuck, e6_1] }
        - { at: "2027-04-01", screen: e4_2, waitingScreens: *attest_open }
        - { at: "2027-05-01", screen: e4_3, waitingScreens: *attest_open }
        - { at: "2027-05-20", screen: e4_4, waitingScreens: *attest_open }
        - { at: "2027-03-31", screen: e6_1, skipIfAnswered: [e6_1.done], waitingScreens: &after_enroll [e2_6, e3_1, e3_wait, e4_1, e4_2, e4_3, e4_4, e4_wip, e4_finish, e4_stuck, e5_1, e5_wait, e6_1, e_done] }
        - { at: "2027-04-30", screen: e6_1, skipIfAnswered: [e6_1.done], waitingScreens: *after_enroll }
        - { at: "2027-05-20", screen: e6_1, skipIfAnswered: [e6_1.done], waitingScreens: *after_enroll }
        - { at: "2027-05-29", screen: e6_1, skipIfAnswered: [e6_1.done], waitingScreens: *after_enroll }
    buttons:
      - { label: "Начинаем", data: s6.go, next: e1_1 }
    back: s5

  # ─────────────────── Этап 1. Доступ к платформе (раздел 3) ───────────────────

  - id: e1_1
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-1-key-at-gate.jpg"
    text: |-
      {{#if isReturning}}Вы уже учились у нас — войти можно по прежним логину и паролю.

      <b>Получилось войти?</b>{{else}}✉️ Логин и пароль приходят письмом на почту плательщика — в день оплаты.

      <b>Письмо пришло?</b>{{/if}}
    buttons:
      - { label: "Да", data: e1_1.yes, next: e1_3 }
      - { label: "Нет", data: e1_1.no, next: e1_2 }
    back: s6
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_2
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: |-
      ✉️ Такие письма иногда попадают в спам.

      <b>Загляните в папку «Спам» — письмо там?</b>
    buttons:
      - { label: "Нашёл", data: e1_2.found, next: e1_3 }
      - { label: "Там пусто", data: e1_2.empty, next: e1_2a }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_2a
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-2a-support-help.jpg"
    text: |-
      Похоже, письмо не пришло. Не переживайте!

      Клиентский сервис поможет разобраться — коллеги уже видят, на каком вы шаге.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
      - { label: "Я разберусь позже", data: e1_2a.later, next: e2_0 }
    menu: true

  - id: e1_3
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-3-gate-opens.jpg"
    text: |-
      Теперь войдите на платформу по этим данным.

      <b>Получилось?</b>
    buttons:
      - { label: "Да, я внутри", data: e1_3.yes, next: e1_5 }
      - { label: "Не получается", data: e1_3.no, next: e1_4 }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_4
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-4-diagnostics-panel.jpg"
    text: |-
      Выберите, что ближе к вашей ситуации, — так будет проще помочь.

      <b>Что пошло не так?</b>
    buttons:
      - { label: "Не подходит пароль", data: e1_4.password, next: e1_4_password }
      - { label: "Страница не открывается", data: e1_4.page, next: e1_4_page }
      - { label: "Не понимаю, куда нажимать", data: e1_4.confused, next: e1_4_confused }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: e1.defer, next: e2_0 }

  - id: e1_4_password
    stage: stage1_access
    stepLabel: "<b>Шаг 1 из 6 · Доступ к платформе</b>"
    image: "shots/e1-4-fix-on-site.jpg"
    # «Уже учились» — пароль можно восстановить и в личном кабинете (по просьбе
    # от 29.09). Впервые пришедшим личного кабинета ещё нет — им только «Забыли пароль».
    text: |-
      {{#if isReturning}}Пароль можно восстановить двумя способами:
      • в личном кабинете;
