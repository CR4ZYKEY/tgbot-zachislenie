  - id: e5_1
    stage: stage5_certificate
    stepLabel: "<b>Шаг 5 из 6 · Итоговая справка</b>"
    image: "shots/grades-certificate.jpg"
    text: |-
      ✦ <b>Класс завершён!</b>

      📍 Справка с оценками появится в <b>Секретариате</b> → «<b>Мои справки</b>». Её выдают, если с зачисления прошло не меньше 21 дня.

      <b>Справка уже есть?</b>
    buttons:
      - { label: "Справка скачана", data: e5_1.yes, next: e_done }
      - { label: "Справки пока нет", data: e5_1.no, next: e5_wait }
    menu: true

  # Спрашивает снова каждые 3 дня, пока справки нет (rearm) — до паузы
  # после трёх касаний без ответа.
  - id: e5_wait
    stage: stage5_certificate
    stepLabel: "<b>Шаг 5 из 6 · Итоговая справка</b>"
    image: "shots/grades-certificate-soon.jpg"
    text: |-
      Хорошо, загляну через пару дней.

      Если справка появится раньше — нажмите кнопку ниже.
    reminders:
      waitingScreens: [e5_wait]
      schedule:
        - { afterHours: 72, screen: e5_1, rearm: true }
    buttons:
      - { label: "Справка скачана", data: e5_wait.yes, next: e_done }
    menu: true

  # ─────────────────── Шаг 6. Продление со скидкой ───────────────────
  # Срок продления (31 мая) наступает раньше, чем справка, поэтому шаг 6 не
  # стоит в цепочке после шага 5: его показывают напоминания с s6 поверх
  # текущего шага, и обе кнопки возвращают родителя туда, где он был.

  - id: e6_1
    stage: stage6_renewal
    stepLabel: "<b>Шаг 6 из 6 · Продление со скидкой</b>"
    image: "shots/renewal-next-year.jpg"
    text: |-
      Пора подумать о следующем учебном годе.

      📅 Если купить пакет <b>до 31 мая 2027</b>, сохранится льготная цена, а учёба продолжится без перерыва.

      <b>Уже продлили?</b>
    buttons:
      - { label: "Уже продлили", data: e6_1.done, next: previous }
      - { label: "Напомнить позже", data: e6_1.later, next: previous }
    menu: true

  - id: e_done
    stage: stage6_renewal
    terminal: true
    image: "shots/year-complete.jpg"
    text: |-
      ✦ <b>Все шаги пройдены!</b>

      Класс завершён, справка с оценками у вас.

      Осталось продление со скидкой — если ещё не успели.
    buttons:
      - { label: "Продление со скидкой", data: e_done.renew, next: e6_1 }
    menu: true
