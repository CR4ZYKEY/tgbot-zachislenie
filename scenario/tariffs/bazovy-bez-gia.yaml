# Тариф «Базовый», 9 и 11 класс БЕЗ ГИА — «Путь выпускника на семейном обучении».
#
# Вход: s3 «Базовый» → s4b «9 / 11 класс» → s_gia «Без ГИА» → g_s5.
# С другими ветками не пересекается: этапы 1–2 — свои копии (g1_*, g2_*),
# дальше шаги 3–8 по памяткам «Путь выпускника на семейном обучении» 2026/2027
# (ГИА семья проходит сама). Макет и решения — docs/graduate/Путь_выпускника.md.
#
# Тексты ОГЭ/ЕГЭ — один экран с {{#if grade11}}…{{else}}…{{/if}}: grade11
# движок выставляет по полю class (его пишет s4b).

screens:

  - id: g_s5
    stage: graduate_start
    image: "shots/s5-garden-fork.jpg"
    text: "Вы у нас впервые или уже учились?"
    buttons:
      - { label: "Впервые", data: g_s5.new, next: g_map, setField: { field: isReturning, value: "false" } }
      - { label: "Уже учились", data: g_s5.ret, next: g_map, setField: { field: isReturning, value: "true" } }
    back: s_gia

  # Календарь выпускника ставится здесь, одним списком: через g_map проходят
  # все выпускники, и класс к этому моменту уже известен (forClass).
  # Напоминание уходит, только если в свой день родитель ещё на шагах,
  # к которым оно относится (waitingScreens у каждой даты) — сделал шаг
  # раньше, и оно молча снимается.
  # minDaysFromStart: 0 — это дедлайны, правило «не ближе 14 дней от старта»
  # для них отключено (иначе пришедший 5 ноября не услышит о сроке 18 ноября).
  # Даты с ✎ примерные: в памятках для них указан только месяц.
  - id: g_map
    stage: graduate_start
    image: "shots/g-map-graduate-road.jpg"
    text: |-
      Спасибо за ответы! Впереди путь выпускника — пройдём его по шагам.

      <b>1. Доступ к платформе</b> — 1 день после оплаты
      <b>2. Зачисление в школу</b> — 10 дней
      <b>3. Аттестация, открепление и школа по месту жительства</b> — до 1 декабря 2026
      <b>4. Заявления на {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}}</b> — с 1 октября 2026
      <b>5. Подготовка и пробники</b> — осень – весна
      <b>6. {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b> — {{#if grade11}}2 декабря 2026{{else}}10 февраля 2027{{/if}}
      <b>7. Экзамены и результаты</b> — весна – лето 2027
      <b>8. Аттестат</b> — лето 2027

      Начнём с первых двух — это займёт несколько минут.
    reminders:
      waitingScreens: [g_map]
      schedule:
        # Открылся приём заявлений на экзамен и допуск.
        - at: "2026-10-01"
          minDaysFromStart: 0
          screen: g4_1
          waitingScreens: &before_applied [g2_6, g3_0, g3_wait, g3_1, g3_how, g3_later, g3_attach, g3_attach_later, g4_1, g4_how, g4_later]
        # 11: заявление на сочинение принимают до 18 ноября.
        - at: "2026-11-11"
          minDaysFromStart: 0
          forClass: ["11"]
          screen: g4_1
          waitingScreens: *before_applied
        # 11: итоговое сочинение 2 декабря.
        - at: "2026-11-25"
          minDaysFromStart: 0
          forClass: ["11"]
          screen: g6_1
          waitingScreens: &before_admission [g2_6, g3_0, g3_wait, g3_1, g3_how, g3_later, g3_attach, g3_attach_later, g4_1, g4_how, g4_later, g5_1, g5_mcko, g5_res, g5_wait, g5_dates]
        # ✎ ≈ 15.12: опубликовано расписание ОГЭ / ЕГЭ. У 11 класса к этому
        # времени сочинение позади — они ждут результата на шаге 6.
        - at: "2026-12-15"
          minDaysFromStart: 0
          screen: g5_dates
          waitingScreens: [g2_6, g3_0, g3_wait, g3_1, g3_how, g3_later, g3_attach, g3_attach_later, g4_1, g4_how, g4_later, g5_1, g5_mcko, g5_res, g5_wait, g6_ready, g6_late, g6_retry]
        # ✎ ≈ 16.12, 11: как прошло сочинение.
        - at: "2026-12-16"
          minDaysFromStart: 0
          forClass: ["11"]
          screen: g6_result
          waitingScreens: [g5_wait, g5_dates, g6_ready, g6_late, g6_retry]
        # 9: заявление на собеседование принимают до 27 января.
        - at: "2027-01-20"
          minDaysFromStart: 0
          forClass: ["9"]
          screen: g4_1
          waitingScreens: *before_applied
        # 9: итоговое собеседование 10 февраля.
        - at: "2027-02-03"
          minDaysFromStart: 0
          forClass: ["9"]
          screen: g6_1
          waitingScreens: *before_admission
        # ✎ ≈ 24.02, 9: как прошло собеседование.
        - at: "2027-02-24"
          minDaysFromStart: 0
          forClass: ["9"]
          screen: g6_result
          waitingScreens: [g6_ready, g6_late, g6_retry]
        # ✎ ≈ 15.04: пришло ли уведомление о пункте проведения.
        - at: "2027-04-15"
          minDaysFromStart: 0
          screen: g7_notice
          waitingScreens: [g7_1]
        # ✎ ≈ 01.07: результаты экзаменов.
        - at: "2027-07-01"
          minDaysFromStart: 0
          screen: g7_results
          waitingScreens: [g7_1, g7_notice, g7_ask, g7_day]
        # Аттестация и открепление — до 1 декабря (протокол КС 07.10.2026).
        - at: "2026-11-10"
          minDaysFromStart: 0
          screen: g3_1
          waitingScreens: [g2_6, g3_0, g3_wait, g3_how, g3_later]
        - at: "2026-11-24"
          minDaysFromStart: 0
          screen: g3_1
          waitingScreens: [g2_6, g3_0, g3_wait, g3_how, g3_later, g3_1]
    buttons:
      - { label: "Начинаем", data: g_map.go, next: g1_1 }
    back: g_s5

  # ─────────── Путь выпускника · Шаг 1. Доступ к платформе ───────────
  # Копия этапа 1 (e1_*): тот же порядок экранов и ветки помощи. Отличаются
  # «Шаг 1 из 8» и «Зайду на платформу позже» — ведёт в зачисление
  # выпускника (g2_0), а не в общее. Копии свои — правятся независимо.

  - id: g1_1
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-1-key-at-gate.jpg"
    text: >-
      {{#if isReturning}}Вы уже учились у нас, так что войти можно
      по прежним данным. Получилось?{{else}}Вам должны были прислать
      логин и пароль от платформы — письмом на почту плательщика,
      в день оплаты. Письмо пришло?{{/if}}
    buttons:
      - { label: "Да", data: g1_1.yes, next: g1_3 }
      - { label: "Нет", data: g1_1.no, next: g1_2 }
    back: g_map
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: g1.defer, next: g2_0 }

  - id: g1_2
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Такие письма иногда улетают в спам. Загляните в папку «Спам» —
      возможно, оно там.
    buttons:
      - { label: "Нашёл", data: g1_2.found, next: g1_3 }
      - { label: "Там пусто", data: g1_2.empty, next: g1_2a }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: g1.defer, next: g2_0 }

  - id: g1_2a
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-2a-support-help.jpg"
    text: >-
      Похоже, письмо не приходило. Не переживайте — служба
      сопровождения поможет разобраться, она уже видит, на каком вы шаге.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
      - { label: "Я разберусь позже", data: g1_2a.later, defer: true, next: g2_0 }
    menu: true

  - id: g1_3
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-3-gate-opens.jpg"
    text: "Теперь попробуйте войти на платформу по этим данным. Получилось?"
    buttons:
      - { label: "Да, я внутри", data: g1_3.yes, next: g1_5 }
      - { label: "Не получается", data: g1_3.no, next: g1_4 }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: g1.defer, next: g2_0 }

  - id: g1_4
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-4-diagnostics-panel.jpg"
    text: "Расскажите, что не так — так будет проще помочь."
    buttons:
      - { label: "Не подходит пароль", data: g1_4.password, next: g1_4_password }
      - { label: "Страница не открывается", data: g1_4.page, next: g1_4_page }
      - { label: "Не понимаю, куда нажимать", data: g1_4.confused, next: g1_4_confused }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: g1.defer, next: g2_0 }

  - id: g1_4_password
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-4-fix-on-site.jpg"
    text: >-
      ✎ {{#if isReturning}}Пароль можно восстановить в личном кабинете или нажать
      «Забыли пароль» на странице входа — новый придёт на ту же почту.{{else}}Попробуйте
      нажать «Забыли пароль» на странице входа — новый придёт на ту же почту.{{/if}}
    buttons:
      - { label: "Да", data: g1_4_password.yes, next: g1_5 }
      - { label: "Нет, напишу в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: g1_4_page
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-4-page-refresh.jpg"
    text: "✎ Попробуйте обновить страницу или открыть её в другом браузере — обычно это помогает."
    buttons:
      - { label: "Да", data: g1_4_page.yes, next: g1_5 }
      - { label: "Нет, напишу в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: g1_4_confused
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-4-find-tile.jpg"
    text: "✎ После входа найдите и нажмите на плитку в центре экрана — это и есть вход в Город."
    buttons:
      - { label: "Да", data: g1_4_confused.yes, next: g1_5 }
      - { label: "Нет, напишу в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }

  - id: g1_5
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-5-first-city-reveal.jpg"
    text: "Вот вы и в Городе — так выглядит платформа изнутри. Как вам первое впечатление?"
    buttons:
      - { label: "Нравится", data: g1_5.like, next: g1_6 }
      - { label: "Пока непонятно", data: g1_5.unclear, next: g1_5b }
    menu: true

  - id: g1_5b
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-5b-thought-bubble.jpg"
    text: |-
      <b>Что смущает?</b>

      Опишите в двух словах в ответ на это сообщение — учтём.
    input:
      field: city_feedback
      next: g1_5c
      validation: none

  - id: g1_5c
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-5c-lighthouse-guide.jpg"
    text: >-
      Спасибо за отзыв! Освоиться помогает экскурсия по Городу —
      пройдите её вместе с героем, будет проще.
    buttons:
      - { label: "Спасибо, посмотрю", data: g1_5c.ok, next: g1_6 }

  - id: g1_6
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-6-school-building.jpg"
    text: >-
      Зайдите в здание «<b>Школа</b>» → кабинет «Информация для старта» —
      там весь гайд по обучению: как устроена платформа, сроки
      обучения и аттестаций, правила оценок.
    buttons:
      - { label: "Нашёл", data: g1_6.found, next: g1_7 }
      - { label: "Не нашёл", data: g1_6.notfound, next: g1_6b }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: g1.defer, next: g2_0 }

  - id: g1_6b
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    text: >-
      Откройте здание «<b>Школа</b>», затем кабинет «Информация для
      старта» — вот как это выглядит.
    image: "✎ shots/e1_6b_school_info.png"
    buttons:
      - { label: "Дальше", data: g1_6b.ok, next: g1_7 }

  - id: g1_7
    stage: graduate_access
    stepLabel: "<b>Шаг 1 из 8 · Доступ к платформе</b>"
    image: "shots/e1-7-access-open.jpg"
    text: >-
      ✦ <b>Доступ открыт.</b> Вы разобрались, как всё устроено, —
      ваш герой готов приступить к занятиям.
    buttons:
      - { label: "Дальше — к зачислению", data: g1_7.next, next: g2_0 }


  # ─────────── Путь выпускника · Шаг 2. Зачисление в школу ───────────
  # Копия этапа 2 (e2_*) вместе с напоминаниями о письме школы. Изменены
  # вступление (g2_0), справка (g2_5) и финал (g2_6) — он ведёт к экзаменам.

  - id: g2_0
    # Спека, относительные триггеры: этап 2 — день 3 и день 7, пока документы
    # не отправлены; отложенный этап 1 — +3 дня, пока родитель не вернулся к платформе.
    reminders:
      waitingScreens: [g2_0, g2_1, g2_1_spam, g2_1_kc, g2_2, g2_2a, g2_2a_missing, g2_2a_list, g2_2a_where, g2_2a_time, g2_2_r, g2_2_d3, g2_2_d7]
      schedule:
        - { afterHours: 72, screen: g2_2_d3 }
        - { afterHours: 168, screen: g2_2_d7 }
        - { afterHours: 72, screen: g1_return, ifDeferred: true }
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/g2-0-enrollment-then-exams.jpg"
    text: |-
      Переходим к зачислению в нашу школу — здесь ваш герой проходит промежуточную аттестацию. Экзамены — отдельный путь, к нему перейдём сразу после.

      Зачисление — это два этапа:
      <b>1. Личные документы</b> — то, что нужно отправить от вас.
      <b>2. Подписание документов со школой</b> — школа пришлёт документы, вам останется их подписать.

      Рекомендуем уложиться в 10 дней.
    buttons:
      - { label: "Понятно, начинаем", data: g2_0.ok, next: g2_1 }
    back: g_map
    menu: true

  - id: g2_1
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/e2-1-document-scroll.jpg"
    text: "Вам должно было прийти письмо со списком необходимых документов. Оно пришло?"
    buttons:
      - { label: "Да", data: g2_1.yes, next: g2_2 }
      - { label: "Нет", data: g2_1.no, next: g2_1_spam }
      - { label: "Пока пройду шаг с платформой", data: g2_1.to_stage1, next: g1_1 }
    menu: true

  - id: g2_1_spam
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Такие письма иногда улетают в спам. Загляните в папку «Спам» —
      возможно, оно там.
    buttons:
      - { label: "Нашёл", data: g2_1_spam.found, next: g2_2 }
      - { label: "Там пусто", data: g2_1_spam.empty, next: g2_1_kc }
    menu: true

  - id: g2_1_kc
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/e1-2a-support-help.jpg"
    text: >-
      Похоже, письмо не приходило. Не переживайте — служба
      сопровождения поможет разобраться, она уже видит, на каком вы шаге.
    buttons:
      - { label: "Написать в клиентский сервис", url: "https://t.me/{{kc_username}}?start={{kc_context}}" }
      - { label: "Я разберусь позже", data: g2_1_kc.later, next: g2_2 }
    menu: true

  - id: g2_2
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/e2-2-mail-drone.jpg"
    text: >-
      {{#if isReturning}}Раз вы уже учились у нас, нужны только
      недостающие документы — то, чего не хватало в прошлый раз.
      Вы их отправили?{{else}}Соберите документы по списку из письма
      и отправьте их по инструкции — этого шага не миновать. Уже
      отправили?{{/if}}
    buttons:
      - { label: "Да, отправил", data: g2_2.yes, next: g2_2_sent }
      - { label: "Ещё нет", data: g2_2.no, next: g2_2a }
    menu: true

  - id: g2_2_sent
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/e2-2-sent-docs-check.jpg"
    text: |-
      Документы получены — забрали их в работу. Сейчас проверяем, всё ли на месте.

      Ответ придёт вам <b>на почту</b>: если всё в порядке, следующим письмом будут документы на подпись. Я загляну напомнить, чтобы письмо не потерялось.
    reminders:
      waitingScreens: [g2_2_sent, g2_3, g2_3_spam, g2_3_wait, g2_3_ping2, g2_3_kc]
      schedule:
        - { afterHours: 24, screen: g2_3 }
        - { afterHours: 48, screen: g2_3_ping2 }
    buttons:
      - { label: "Проверить почту сейчас", data: g2_2_sent.check, next: g2_3 }
    menu: true

  - id: g2_2a
    stage: graduate_enrollment
    stepLabel: "<b>Шаг 2 из 8 · Зачисление в школу</b>"
    image: "shots/e2-2a-checklist-question.jpg"
    text: "Расскажите, что мешает — разберёмся вместе."
    buttons:
      - { label: "Не хватает документа", data: g2_2a.missing_doc, next: g2_2a_missing }
      - { label: "Не понял, что нужно", data: g2_2a.unclear_list, next: g2_2a_list }
      - { label: "Не понял, куда слать", data: g2_2a.unclear_where, next: g2_2a_where }
      - { label: "Нужно время", data: g2_2a.need_time, next: g2_2a_time }

