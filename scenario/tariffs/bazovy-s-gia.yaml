# Тариф «Базовый с ГИА», 9 и 11 класс — «Путь выпускника с сопровождением ЦПСО».
# Источник: ЭдПалм_Базовый-с-ГИА_9-класс / 11-класс_Путь-выпускника (2026/2027).
#
# Вход: s3 «Базовый» → s4b «9 / 11 класс» → s_gia «Базовый с ГИА» → bg_s5.
# С другими ветками не пересекается: шаги 1–2 — свои копии этапов 1–2
# «Базового» (помощь — куратор выпускников, t.me/giahssc_bot), дальше
# шаги 3–10 (у 9 класса ещё 11 — продление в 10 класс).
# Выпускной год идёт по двум линиям: аттестации на платформе (до 01.04.2027)
# и мероприятия ГИА (заявка в ноябре, допуск, экзамены).
#
# Тексты ОГЭ/ЕГЭ и число шагов (11 у 9 класса, 10 у 11) — через
# {{#if grade11}}…{{else}}…{{/if}}: grade11 движок берёт из поля class.

screens:

  - id: bg_s5
    stage: bgia_start
    image: "shots/s5-garden-fork.jpg"
    text: "Вы у нас впервые или уже учились?"
    buttons:
      - { label: "Впервые", data: bg_s5.new, next: bg_map, setField: { field: isReturning, value: "false" } }
      - { label: "Уже учились", data: bg_s5.ret, next: bg_map, setField: { field: isReturning, value: "true" } }
    back: s_gia

  # Календарь ставится здесь: через bg_map проходят все родители тарифа, класс
  # уже известен (forClass). Напоминание уходит, только если в свой день
  # родитель ещё на шагах из waitingScreens этой даты. minDaysFromStart: 0 —
  # это дедлайны ГИА, правило «не ближе 14 дней от старта» для них отключено.
  # ✎ — даты примерные: в инструкции только месяц.
  - id: bg_map
    stage: bgia_start
    image: "shots/gia-map-two-lines.jpg"
    text: |-
      Спасибо за ответы! Впереди путь выпускника — {{#if grade11}}10{{else}}11{{/if}} шагов до аттестата.

      <b>1. Доступ к платформе</b> — после оплаты
      <b>2. Зачисление в школу</b> — сентябрь
      <b>3. Учёба и аттестации</b> — до 1 апреля 2027
      <b>4. Заявка на {{#if grade11}}ЕГЭ и сочинение{{else}}ОГЭ и собеседование{{/if}}</b> — ноябрь 2026
      <b>5. Расписание экзаменов</b> — декабрь 2026
      <b>6. {{#if grade11}}Итоговое сочинение{{else}}Итоговое собеседование{{/if}}</b> — {{#if grade11}}2 декабря 2026{{else}}10 февраля 2027{{/if}}
      <b>7. Завершение класса</b> — до 1 апреля 2027
      <b>8. Справка с оценками</b> — после завершения класса
      <b>9. {{#if grade11}}ЕГЭ{{else}}ОГЭ{{/if}}</b> — весна – лето 2027
      <b>10. Аттестат</b> — лето 2027{{#if grade11}}{{else}}
      <b>11. Продление в 10 класс</b> — до 31 мая 2027{{/if}}

      На любом шаге рядом куратор выпускников — пишите ему, если что-то непонятно.
    reminders:
      waitingScreens: [bg_map]
      schedule:
        # Заявка на ГИА — ноябрь.
        - { at: "2026-11-02", minDaysFromStart: 0, screen: bg4_1, waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_wait, bg4_noinstr] }
        - { at: "2026-11-16", minDaysFromStart: 0, screen: bg4_1b, waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_wait, bg4_noinstr, bg4_1b] }
        # 11: сочинение 02.12, результат через 7 рабочих дней.
        - { at: "2026-11-25", minDaysFromStart: 0, forClass: ["11"], screen: bg6_1, waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_wait, bg4_noinstr, bg4_1b, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait] }
        - { at: "2026-12-11", minDaysFromStart: 0, forClass: ["11"], screen: bg6_result, waitingScreens: [bg5_wait, bg5_dates, bg6_ready, bg6_nonotice, bg6_retry] }
        # ✎ Расписание ГИА — «декабрь 2026».
        - { at: "2026-12-15", minDaysFromStart: 0, screen: bg5_dates, waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_wait, bg4_noinstr, bg4_1b, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg6_ready, bg6_nonotice, bg6_retry, bg7_0, bg7_1, bg7_wip] }
        # 9: собеседование 10.02, результат через 7 рабочих дней.
        - { at: "2027-02-03", minDaysFromStart: 0, forClass: ["9"], screen: bg6_1, waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_wait, bg4_noinstr, bg4_1b, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg5_dates] }
        - { at: "2027-02-19", minDaysFromStart: 0, forClass: ["9"], screen: bg6_result, waitingScreens: [bg6_ready, bg6_nonotice, bg6_retry] }
        # Аттестации и завершение класса — до 01.04.
        - { at: "2027-03-01", minDaysFromStart: 0, screen: bg7_1, waitingScreens: [bg3_1, bg4_1, bg4_1b, bg4_wait, bg4_noinstr, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg5_dates, bg7_0, bg7_wip, bg11_1] }
        - { at: "2027-03-15", minDaysFromStart: 0, screen: bg7_2, waitingScreens: [bg3_1, bg4_1, bg4_1b, bg4_wait, bg4_noinstr, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg5_dates, bg7_0, bg7_wip, bg11_1, bg7_1] }
        # ✎ Направление на экзамен — за 14 дней до первого.
        - { at: "2027-05-12", minDaysFromStart: 0, screen: bg9_notice, waitingScreens: [bg7_0, bg7_1, bg7_2, bg7_wip, bg7_finish, bg7_stuck, bg8_1, bg8_wait, bg9_1] }
        # ✎ Результаты экзаменов.
        - { at: "2027-07-01", minDaysFromStart: 0, screen: bg9_results, waitingScreens: [bg9_1, bg9_notice, bg9_ask, bg9_day] }
        # 9: продление в 10 класс — до 31.05, поверх любого шага.
        - { at: "2027-04-30", forClass: ["9"], screen: bg11_1, skipIfAnswered: [bg11_1.done], waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_1b, bg4_wait, bg4_noinstr, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg5_dates, bg6_1, bg6_ready, bg6_nonotice, bg6_result, bg6_retry, bg7_0, bg7_1, bg7_2, bg7_wip, bg7_finish, bg7_stuck, bg8_1, bg8_wait, bg9_1, bg9_notice, bg9_ask, bg9_day, bg9_results, bg10_1, bg11_1] }
        - { at: "2027-05-20", forClass: ["9"], screen: bg11_1, skipIfAnswered: [bg11_1.done], waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_1b, bg4_wait, bg4_noinstr, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg5_dates, bg6_1, bg6_ready, bg6_nonotice, bg6_result, bg6_retry, bg7_0, bg7_1, bg7_2, bg7_wip, bg7_finish, bg7_stuck, bg8_1, bg8_wait, bg9_1, bg9_notice, bg9_ask, bg9_day, bg9_results, bg10_1, bg11_1] }
        - { at: "2027-05-29", forClass: ["9"], screen: bg11_1, skipIfAnswered: [bg11_1.done], waitingScreens: [bg2_6, bg3_1, bg4_1, bg4_1b, bg4_wait, bg4_noinstr, bg4_notice, bg5_1, bg5_mcko, bg5_res, bg5_wait, bg5_dates, bg6_1, bg6_ready, bg6_nonotice, bg6_result, bg6_retry, bg7_0, bg7_1, bg7_2, bg7_wip, bg7_finish, bg7_stuck, bg8_1, bg8_wait, bg9_1, bg9_notice, bg9_ask, bg9_day, bg9_results, bg10_1, bg11_1] }
    buttons:
      - { label: "Начинаем", data: bg_map.go, next: bg1_1 }
    back: bg_s5

  # ─────────── Шаги 1–2. Доступ к платформе и зачисление ───────────
  # Копия этапов 1–2 «Базового»: тот же порядок экранов и ветки помощи,
  # только помощь — куратор выпускников. Правятся независимо от «Базового».

  - id: bg1_1
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-1-key-at-gate.jpg"
    text: >-
      {{#if isReturning}}Вы уже учились у нас, так что войти можно
      по прежним данным. Получилось?{{else}}Вам должны были прислать
      логин и пароль от платформы — письмом на почту плательщика,
      в день оплаты. Письмо пришло?{{/if}}
    buttons:
      - { label: "Да", data: bg1_1.yes, next: bg1_3 }
      - { label: "Нет", data: bg1_1.no, next: bg1_2 }
    back: bg_map
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: bg1.defer, next: bg2_0 }

  - id: bg1_2
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Такие письма иногда улетают в спам. Загляните в папку «Спам» —
      возможно, оно там.
    buttons:
      - { label: "Нашёл", data: bg1_2.found, next: bg1_3 }
      - { label: "Там пусто", data: bg1_2.empty, next: bg1_2a }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: bg1.defer, next: bg2_0 }

  - id: bg1_2a
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-2a-support-help.jpg"
    text: >-
      Похоже, письмо не приходило. Не переживайте — куратор выпускников
      поможет разобраться.
    buttons:
      - { label: "Написать куратору выпускников", url: "https://t.me/giahssc_bot" }
      - { label: "Я разберусь позже", data: bg1_2a.later, next: bg2_0 }
    menu: true

  - id: bg1_3
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-3-gate-opens.jpg"
    text: "Теперь попробуйте войти на платформу по этим данным. Получилось?"
    buttons:
      - { label: "Да, я внутри", data: bg1_3.yes, next: bg1_5 }
      - { label: "Не получается", data: bg1_3.no, next: bg1_4 }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: bg1.defer, next: bg2_0 }

  - id: bg1_4
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-4-diagnostics-panel.jpg"
    text: "Расскажите, что не так — так будет проще помочь."
    buttons:
      - { label: "Не подходит пароль", data: bg1_4.password, next: bg1_4_password }
      - { label: "Страница не открывается", data: bg1_4.page, next: bg1_4_page }
      - { label: "Не понимаю, куда нажимать", data: bg1_4.confused, next: bg1_4_confused }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: bg1.defer, next: bg2_0 }

  - id: bg1_4_password
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-4-fix-on-site.jpg"
    text: >-
      ✎ {{#if isReturning}}Пароль можно восстановить в личном кабинете или нажать
      «Забыли пароль» на странице входа — новый придёт на ту же почту.{{else}}Попробуйте
      нажать «Забыли пароль» на странице входа — новый придёт на ту же почту.{{/if}}
    buttons:
      - { label: "Да", data: bg1_4_password.yes, next: bg1_5 }
      - { label: "Нет, напишу куратору", url: "https://t.me/giahssc_bot" }

  - id: bg1_4_page
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-4-page-refresh.jpg"
    text: "✎ Попробуйте обновить страницу или открыть её в другом браузере — обычно это помогает."
    buttons:
      - { label: "Да", data: bg1_4_page.yes, next: bg1_5 }
      - { label: "Нет, напишу куратору", url: "https://t.me/giahssc_bot" }

  - id: bg1_4_confused
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-4-find-tile.jpg"
    text: "✎ После входа найдите и нажмите на плитку в центре экрана — это и есть вход в Город."
    buttons:
      - { label: "Да", data: bg1_4_confused.yes, next: bg1_5 }
      - { label: "Нет, напишу куратору", url: "https://t.me/giahssc_bot" }

  - id: bg1_5
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-5-first-city-reveal.jpg"
    text: "Вот вы и в Городе — так выглядит платформа изнутри. Как вам первое впечатление?"
    buttons:
      - { label: "Нравится", data: bg1_5.like, next: bg1_6 }
      - { label: "Пока непонятно", data: bg1_5.unclear, next: bg1_5b }
    menu: true

  - id: bg1_5b
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-5b-thought-bubble.jpg"
    text: |-
      <b>Что смущает?</b>

      Опишите в двух словах в ответ на это сообщение — учтём.
    input:
      field: city_feedback
      next: bg1_5c
      validation: none

  - id: bg1_5c
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-5c-lighthouse-guide.jpg"
    text: >-
      Спасибо за отзыв! Освоиться помогает экскурсия по Городу —
      пройдите её вместе с героем, будет проще.
    buttons:
      - { label: "Спасибо, посмотрю", data: bg1_5c.ok, next: bg1_6 }

  - id: bg1_6
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-6-school-building.jpg"
    text: >-
      Зайдите в здание «<b>Школа</b>» → кабинет «Информация для старта» —
      там весь гайд по обучению: как устроена платформа, сроки
      обучения и аттестаций, правила оценок.
    buttons:
      - { label: "Нашёл", data: bg1_6.found, next: bg1_7 }
      - { label: "Не нашёл", data: bg1_6.notfound, next: bg1_6b }
    menu: true
    deferButton: { label: "Зайду на платформу позже — к зачислению", data: bg1.defer, next: bg2_0 }

  - id: bg1_6b
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    text: >-
      Откройте здание «<b>Школа</b>», затем кабинет «Информация для
      старта» — вот как это выглядит.
    image: "✎ shots/e1_6b_school_info.png"
    buttons:
      - { label: "Дальше", data: bg1_6b.ok, next: bg1_7 }

  - id: bg1_7
    stage: bgia_access
    stepLabel: "<b>Шаг 1 из {{#if grade11}}10{{else}}11{{/if}} · Доступ к платформе</b>"
    image: "shots/e1-7-access-open.jpg"
    text: >-
      ✦ <b>Доступ открыт.</b> Вы разобрались, как всё устроено, —
      ваш герой готов приступить к занятиям.
    buttons:
      - { label: "Дальше — к зачислению", data: bg1_7.next, next: bg2_0 }


  - id: bg2_0
    stage: bgia_enrollment
    stepLabel: "<b>Шаг 2 из {{#if grade11}}10{{else}}11{{/if}} · Зачисление в школу</b>"
    image: "shots/e2-0-two-archways.jpg"
    text: |-
      Переходим к официальному зачислению — рекомендуем уложиться в 10 дней. Не потому что что-то пропадёт, а потому что справка готовится не мгновенно.

      Дальше вас ждут два этапа:
      <b>1. Личные документы</b> — то, что нужно отправить от вас.
      <b>2. Подписание документов со школой</b> — школа пришлёт документы, вам останется их подписать.

      Расскажу подробно про каждый — начнём с первого.
    buttons:
      - { label: "Понятно, начинаем", data: bg2_0.ok, next: bg2_1 }
    back: bg_map
    menu: true

  - id: bg2_1
    stage: bgia_enrollment
    stepLabel: "<b>Шаг 2 из {{#if grade11}}10{{else}}11{{/if}} · Зачисление в школу</b>"
    image: "shots/e2-1-document-scroll.jpg"
    text: "Вам должно было прийти письмо со списком необходимых документов. Оно пришло?"
    buttons:
      - { label: "Да", data: bg2_1.yes, next: bg2_2 }
      - { label: "Нет", data: bg2_1.no, next: bg2_1_spam }
      - { label: "Пока пройду шаг с платформой", data: bg2_1.to_stage1, next: bg1_1 }
    menu: true

  - id: bg2_1_spam
    stage: bgia_enrollment
    stepLabel: "<b>Шаг 2 из {{#if grade11}}10{{else}}11{{/if}} · Зачисление в школу</b>"
    image: "shots/e1-2-lost-mail-search.jpg"
    text: >-
      Такие письма иногда улетают в спам. Загляните в папку «Спам» —
      возможно, оно там.
    buttons:
      - { label: "Нашёл", data: bg2_1_spam.found, next: bg2_2 }
      - { label: "Там пусто", data: bg2_1_spam.empty, next: bg2_1_kc }
    menu: true

  - id: bg2_1_kc
    stage: bgia_enrollment
    stepLabel: "<b>Шаг 2 из {{#if grade11}}10{{else}}11{{/if}} · Зачисление в школу</b>"
    image: "shots/e1-2a-support-help.jpg"
    text: >-
      Похоже, письмо не приходило. Не переживайте — куратор выпускников
      поможет разобраться.
    buttons:
      - { label: "Написать куратору выпускников", url: "https://t.me/giahssc_bot" }
      - { label: "Я разберусь позже", data: bg2_1_kc.later, next: bg2_2 }
    menu: true

  - id: bg2_2
    stage: bgia_enrollment
    stepLabel: "<b>Шаг 2 из {{#if grade11}}10{{else}}11{{/if}} · Зачисление в школу</b>"
    image: "shots/e2-2-mail-drone.jpg"
    text: >-
      {{#if isReturning}}Раз вы уже учились у нас, нужны только
      недостающие документы — то, чего не хватало в прошлый раз.
      Вы их отправили?{{else}}Соберите документы по списку из письма
      и отправьте их по инструкции — этого шага не миновать. Уже
      отправили?{{/if}}
    buttons:
      - { label: "Да, отправил", data: bg2_2.yes, next: bg2_2_sent }
      - { label: "Ещё нет", data: bg2_2.no, next: bg2_2a }
    menu: true

  - id: bg2_2_sent
    stage: bgia_enrollment
    stepLabel: "<b>Шаг 2 из {{#if grade11}}10{{else}}11{{/if}} · Зачисление в школу</b>"
    image: "shots/e2-2-sent-docs-check.jpg"
    text: |-
      Документы получены — забрали их в работу. Сейчас проверяем, всё ли на месте.

